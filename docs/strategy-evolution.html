<title id="title">How a strategy becomes verified</title><desc id="desc">A completed subtask generates a candidate by task signature. An agent can also propose a candidate. A matching signature with two consecutive successes on distinct subtasks qualifies for automatic verification. Human confirmation can also verify a candidate.</desc>
